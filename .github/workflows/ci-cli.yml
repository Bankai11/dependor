name: ci-cli

# Smoke-tests the Dependor CLI at the repo root (bin/dependor.js + lib/).
# The library and website have their own workflows (ci-library.yml,
# ci-website.yml). Path filters are workflow-level in GitHub Actions and
# ci-library runs on every push to main, so a CLI job there could not be
# path-filtered without a third-party action; hence a separate file.
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-cli.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-cli.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines says >= 18; cover the two active LTS lines with the same
        # exact pins ci-library.yml uses.
        node: ["22.23.4", "24.22.2"]
    env:
      # Deterministic plain-text output for the greps below (chalk honours this).
      FORCE_COLOR: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      # Lockfile-exact install; --ignore-scripts refuses lifecycle scripts from
      # the dependency tree (none are expected: the lockfile has zero
      # hasInstallScript entries).
      - name: Install (lockfile only, no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Lockfile unchanged by install
        run: git diff --exit-code -- package-lock.json

      - name: Help and version
        run: |
          node bin/dependor.js --help | grep -q 'check <package>'
          EXPECTED=$(node -p "require('./package.json').version")
          ACTUAL=$(node bin/dependor.js --version)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::--version printed $ACTUAL, expected $EXPECTED"; exit 1; }

      - name: Missing command exits non-zero
        run: |
          if node bin/dependor.js; then
            echo "::error::expected a non-zero exit when no command is given"; exit 1
          fi

      - name: Unknown package exits non-zero
        run: |
          if node bin/dependor.js check zzqq-definitely-not-a-package-98213; then
            echo "::error::expected a non-zero exit for an unknown package"; exit 1
          fi

      # Representative analysis against the live registry. GitHub API lookups
      # inside the scorer are best-effort (failures are swallowed), so this
      # only needs registry.npmjs.org to be reachable.
      - name: Representative analysis (left-pad)
        run: |
          node bin/dependor.js check left-pad | tee analysis.txt
          grep -q 'Package: left-pad' analysis.txt
          grep -Eq 'Final Risk Score: [0-9]+ / 100' analysis.txt
