# Weekly automated dependency updates for the three projects in this monorepo
# plus the GitHub Actions used by the workflows.
#
# Updates land as pull requests, which run ci-library.yml / ci-website.yml and
# dependency-review.yml (vulnerability gate + Socket scan) before a human
# merges them. Nothing is auto-merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/dependor-di"
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps-lib)" }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/website"
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps-web)" }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps-cli)" }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(ci)" }
