# Weekly automated dependency updates.
#
# Updates land as pull requests, which run the full CI matrix plus
# dependency-review.yml (vulnerability gate + Socket scan) before a human
# merges them. Nothing is auto-merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Keep devDependencies pinned to exact versions in package.json.
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - github-actions
